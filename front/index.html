<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="card" aria-labelledby="table-title">
        <header class="card-header">
                <h1 class="table-title" id="table-title">Listado de ventas</h1>
        </header>
            <div class="card-body">
                <div class="toolbar"></div>
                <div class="table-container" role="region" aria-label="Ventas" tabindex="0">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Cliente</th>
                                <th scope="col">Fecha</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Total</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <tr>
                                <td>Airi Satou</td>
                                <td>Accountant</td>
                                <td>Tokyo</td>
                                <td>$162,700</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer"></div>
            </div>
    </main>
</body>
<script src="BD/ventas.js"></script>
<script src="js/ventas.js"></script>
</html>
